  jft-backend-app:
    build:
      context: ./.build/alpine
      dockerfile: dockerfile_alpine
    image: jft-backend-app:latest
    container_name: jft-backend-app
    restart: unless-stopped
    environment:
      - PYTHONPATH=/home:/home/app:/home/app/backend
    depends_on:
      - jft-mongodb-app
    ports:
      - "5000:5000"
    volumes:
      - ../:/home/app
      - ./main.py:/home/main.py:ro

  jft-mongodb-app:
    build:
      context: .
      dockerfile: mongodb/docker/dockerfile_mongodb
    image: jft-mongodb-app:latest
    container_name: jft-mongodb-app
    restart: unless-stopped
    mem_limit: 1g
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "27017:27017"
    volumes:
      - /datadrive/mongodb:/data/db
